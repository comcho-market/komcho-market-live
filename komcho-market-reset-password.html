<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>パスワード再設定 - こむちょマーケット</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 48 48%27%3E%3Crect width=%2748%27 height=%2748%27 rx=%2710%27 fill=%27%233D5A3E%27/%3E%3Cg transform=%27translate(24,24) scale(0.55)%27%3E%3Cpath d=%27M -26 7 C -17 -17 5 -24 24 -10 C 12 5 -2 19 -21 24%27 fill=%27none%27 stroke=%27%23F8F5EF%27 stroke-width=%275%27 stroke-linecap=%27round%27 stroke-linejoin=%27round%27/%3E%3C/g%3E%3C/svg%3E">
<style>
  :root {
    --bg:          #F8F5EF;
    --bg-card:     #FFFFFF;
    --green-dark:  #3D5A3E;
    --green-mid:   #5A7A5B;
    --green-light: #EAF0E8;
    --gold:        #B8973A;
    --text-main:   #2C2C2C;
    --text-sub:    #6B6B6B;
    --border:      #E2DDD5;
    --radius-card: 12px;
    --shadow-card: 0 2px 12px rgba(0,0,0,0.07);
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', 'Yu Gothic', 'Meiryo', sans-serif;
    background: var(--bg);
    color: var(--text-main);
    max-width: 430px;
    margin: 0 auto;
    min-height: 100vh;
  }
  button { cursor: pointer; border: none; background: none; font-family: inherit; }
  input { font-family: inherit; }

  .header {
    position: sticky; top: 0; z-index: 100;
    background: var(--bg);
    border-bottom: 1px solid var(--border);
    display: flex; align-items: center; justify-content: center;
    padding: 12px 16px;
  }
  .header-logo { display: flex; align-items: center; gap: 7px; }
  .header-logo .logo-icon { width: 24px; height: 19px; flex-shrink: 0; }
  .header-logo .logo-icon path {
    fill: none; stroke: var(--green-dark);
    stroke-width: 3; stroke-linecap: round; stroke-linejoin: round;
  }
  .header-logo .logo-text {
    font-size: 15px; font-weight: 700; letter-spacing: 0.04em;
    color: var(--text-main);
  }

  .hero { padding: 40px 24px 28px; text-align: center; }
  .hero-eyebrow {
    font-size: 11px; color: var(--green-mid);
    letter-spacing: 0.15em; font-weight: 500; margin-bottom: 8px;
  }
  .hero-title {
    font-size: 24px; font-weight: 700;
    color: var(--text-main); letter-spacing: 0.04em;
  }
  .hero-sub {
    font-size: 13px; color: var(--text-sub);
    margin-top: 10px; line-height: 1.7;
  }

  .form-card {
    margin: 0 16px 16px;
    background: var(--bg-card);
    border-radius: var(--radius-card);
    box-shadow: var(--shadow-card);
    padding: 24px 20px;
  }
  .form-field { margin-bottom: 18px; }
  .form-field:last-child { margin-bottom: 0; }
  .form-label {
    display: block; font-size: 12px; font-weight: 600;
    color: var(--text-sub); margin-bottom: 6px;
  }
  .form-input-wrap { position: relative; }
  .form-input {
    width: 100%;
    border: 1.5px solid var(--border);
    border-radius: 10px;
    padding: 13px 44px 13px 14px;
    font-size: 15px; color: var(--text-main);
    background: var(--bg); outline: none;
    -webkit-appearance: none;
    transition: border-color 0.15s, background 0.15s;
  }
  .form-input:focus { border-color: var(--green-dark); background: #fff; }
  .form-input.error { border-color: #CC4444; }
  .pw-toggle {
    position: absolute; right: 14px; top: 50%; transform: translateY(-50%);
    cursor: pointer; padding: 4px; background: none; border: none;
  }
  .pw-toggle svg {
    width: 18px; height: 18px;
    stroke: var(--text-sub); fill: none;
    stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round;
  }
  .field-hint { font-size: 11px; color: var(--text-sub); margin-top: 6px; line-height: 1.6; }

  .login-error {
    display: none;
    background: #FFF0F0; border: 1px solid #FFCCCC;
    border-radius: 8px; padding: 10px 14px;
    font-size: 12px; color: #CC4444; line-height: 1.6;
    margin-bottom: 16px;
  }
  .login-error.visible { display: block; }

  .login-btn {
    width: 100%; height: 52px; border-radius: 26px;
    background: var(--green-dark); color: #fff;
    font-size: 16px; font-weight: 700; letter-spacing: 0.06em;
    cursor: pointer; border: none;
    transition: opacity 0.15s;
    display: flex; align-items: center; justify-content: center; gap: 8px;
  }
  .login-btn:active { opacity: 0.85; }
  .login-btn:disabled { opacity: 0.5; }

  .done-wrap { padding: 60px 24px; text-align: center; display: none; }
  .done-icon { font-size: 40px; margin-bottom: 16px; }
  .done-title { font-size: 17px; font-weight: 700; margin-bottom: 10px; }
  .done-text { font-size: 13px; color: var(--text-sub); line-height: 1.8; margin-bottom: 28px; }

  .link-error-wrap { padding: 60px 24px; text-align: center; display: none; }
</style>
</head>
<body>

<header class="header">
  <a class="header-logo" href="komcho-market-top.html">
    <svg class="logo-icon" viewBox="0 0 60 48">
      <path transform="translate(30,24)" d="M -26 7 C -17 -17 5 -24 24 -10 C 12 5 -2 19 -21 24"/>
    </svg>
    <span class="logo-text">こむちょマーケット</span>
  </a>
</header>

<!-- 入力フォーム -->
<div id="resetFormView">
  <div class="hero">
    <div class="hero-eyebrow">Reset Password</div>
    <div class="hero-title">新しいパスワードの設定</div>
    <div class="hero-sub">新しいパスワードを入力してください。</div>
  </div>

  <div class="form-card">
    <div class="login-error" id="resetError"></div>

    <div class="form-field">
      <label class="form-label" for="newPwInput">新しいパスワード</label>
      <div class="form-input-wrap">
        <input class="form-input" type="password" id="newPwInput"
          placeholder="8文字以上で入力" autocomplete="new-password">
        <button class="pw-toggle" onclick="togglePw('newPwInput','pwEyeIcon1')" type="button">
          <svg id="pwEyeIcon1" viewBox="0 0 24 24">
            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>
          </svg>
        </button>
      </div>
    </div>

    <div class="form-field">
      <label class="form-label" for="newPwInput2">新しいパスワード（確認）</label>
      <div class="form-input-wrap">
        <input class="form-input" type="password" id="newPwInput2"
          placeholder="もう一度入力" autocomplete="new-password">
        <button class="pw-toggle" onclick="togglePw('newPwInput2','pwEyeIcon2')" type="button">
          <svg id="pwEyeIcon2" viewBox="0 0 24 24">
            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>
          </svg>
        </button>
      </div>
      <div class="field-hint">&nbsp;</div>
    </div>

    <button class="login-btn" id="submitBtn" onclick="submitNewPassword()">
      パスワードを更新する
    </button>
  </div>
</div>

<!-- 完了画面 -->
<div class="done-wrap" id="doneView">
  <div class="done-icon">✅</div>
  <div class="done-title">パスワードを更新しました</div>
  <div class="done-text">新しいパスワードでログインしてください。</div>
  <button class="login-btn" id="doneLoginBtn" onclick="window.location.href='komcho-market-login.html'">
    ログイン画面へ
  </button>
</div>

<!-- リンク無効・期限切れ画面 -->
<div class="link-error-wrap" id="linkErrorView">
  <div class="done-icon">⚠️</div>
  <div class="done-title">リンクが無効、または有効期限切れです</div>
  <div class="done-text">お手数ですが、ログイン画面の「パスワードをお忘れの方」から再設定メールをもう一度お送りください。</div>
  <button class="login-btn" onclick="window.location.href='komcho-market-login.html'">
    ログイン画面へ
  </button>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
  const SUPABASE_URL = 'https://uawhrpizzlchkvmzrjzo.supabase.co';
  const SUPABASE_KEY = 'sb_publishable_FaOqUE1PDbo-fpT9KhkWaw__BShLngI';
  const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
</script>

<script>
  function togglePw(inputId, iconId) {
    const input = document.getElementById(inputId);
    const icon  = document.getElementById(iconId);
    const isText = input.type === 'text';
    input.type = isText ? 'password' : 'text';
    icon.innerHTML = isText
      ? '<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>'
      : '<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/>';
  }

  function showResetError(msg) {
    const el = document.getElementById('resetError');
    el.textContent = msg;
    el.classList.add('visible');
  }
  function clearResetError() {
    document.getElementById('resetError').classList.remove('visible');
  }

  async function submitNewPassword() {
    clearResetError();
    const pw1 = document.getElementById('newPwInput').value;
    const pw2 = document.getElementById('newPwInput2').value;

    if (!pw1 || pw1.length < 8) {
      showResetError('パスワードは8文字以上で入力してください。');
      return;
    }
    if (pw1 !== pw2) {
      showResetError('パスワードが一致しません。');
      return;
    }

    const btn = document.getElementById('submitBtn');
    btn.disabled = true;
    btn.textContent = '更新中…';

    const { error } = await supabaseClient.auth.updateUser({ password: pw1 });

    if (error) {
      btn.disabled = false;
      btn.textContent = 'パスワードを更新する';
      showResetError('更新に失敗しました：' + error.message);
      return;
    }

    document.getElementById('resetFormView').style.display = 'none';
    document.getElementById('doneView').style.display = 'block';
    await supabaseClient.auth.signOut();
  }

  // メール内リンクを開くと、Supabaseが一時的なパスワード再設定用セッションを
  // URL（#access_token=...&type=recovery）から自動的に読み取る。これは非同期で、
  // 読み取り完了のタイミングが不定なため、getSession()を1回呼ぶだけだと
  // 「読み取りが終わる前」にチェックしてしまい誤って無効リンク扱いになることがある。
  // そのため onAuthStateChange でセッション確立を待ちつつ、一定時間たっても
  // 確立しなければ（リンク切れ・期限切れ）エラー画面に切り替える。
  let recoveryHandled = false;
  function showLinkError() {
    if (recoveryHandled) return;
    recoveryHandled = true;
    document.getElementById('resetFormView').style.display = 'none';
    document.getElementById('linkErrorView').style.display = 'block';
  }
  function confirmRecoveryOk() {
    recoveryHandled = true; // 入力フォームは最初から表示されているのでそのままでOK
  }

  supabaseClient.auth.onAuthStateChange((event, session) => {
    if (event === 'PASSWORD_RECOVERY' || (session && event === 'SIGNED_IN')) {
      confirmRecoveryOk();
    }
  });

  (async function checkRecoverySession() {
    const { data: { session } } = await supabaseClient.auth.getSession();
    if (session) {
      confirmRecoveryOk();
    } else {
      // まだ確立していなくても、処理中の可能性があるので少し待ってから最終判定する
      setTimeout(() => { if (!recoveryHandled) showLinkError(); }, 3000);
    }
  })();
</script>
</body>
</html>
