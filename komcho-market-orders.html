<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>注文履歴 - こむちょマーケット</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 48 48%27%3E%3Crect width=%2748%27 height=%2748%27 rx=%2710%27 fill=%27%233D5A3E%27/%3E%3Cg transform=%27translate(24,24) scale(0.55)%27%3E%3Cpath d=%27M -26 7 C -17 -17 5 -24 24 -10 C 12 5 -2 19 -21 24%27 fill=%27none%27 stroke=%27%23F8F5EF%27 stroke-width=%275%27 stroke-linecap=%27round%27 stroke-linejoin=%27round%27/%3E%3C/g%3E%3C/svg%3E">
<style>
  :root {
    --bg:          #F8F5EF;
    --bg-card:     #FFFFFF;
    --green-dark:  #3D5A3E;
    --green-mid:   #5A7A5B;
    --green-light: #EAF0E8;
    --gold:        #B8973A;
    --text-main:   #2C2C2C;
    --text-sub:    #6B6B6B;
    --border:      #E2DDD5;
    --radius-card: 12px;
    --shadow-card: 0 2px 12px rgba(0,0,0,0.07);
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', 'Yu Gothic', 'Meiryo', sans-serif;
    background: var(--bg);
    color: var(--text-main);
    max-width: 430px;
    margin: 0 auto;
    min-height: 100vh;
    padding-bottom: 80px;
  }
  a { text-decoration: none; color: inherit; }
  button { cursor: pointer; border: none; background: none; font-family: inherit; }

  /* HEADER */
  .header {
    position: sticky; top: 0; z-index: 100;
    background: var(--bg);
    border-bottom: 1px solid var(--border);
    display: flex; align-items: center; justify-content: space-between;
    padding: 12px 16px;
  }
  .header-back svg {
    width: 22px; height: 22px;
    stroke: var(--text-main); fill: none;
    stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round;
  }
  .header-logo {
    border: 1.5px dashed var(--text-main);
    padding: 6px 14px;
    font-size: 13px; letter-spacing: 0.12em; font-weight: 500;
  }
  .header-title { font-size: 15px; font-weight: 700; letter-spacing: 0.04em; }
  .header-spacer { width: 30px; }

  /* FILTER TABS */
  .filter-tabs {
    background: var(--bg-card);
    border-bottom: 1px solid var(--border);
    display: flex; overflow-x: auto;
    scrollbar-width: none; padding: 0 16px;
  }
  .filter-tabs::-webkit-scrollbar { display: none; }
  .filter-tab {
    flex: 0 0 auto;
    padding: 12px 16px;
    font-size: 13px; font-weight: 500;
    color: var(--text-sub); cursor: pointer;
    border-bottom: 2px solid transparent;
    white-space: nowrap;
    transition: color 0.15s, border-color 0.15s;
  }
  .filter-tab.active {
    color: var(--green-dark); font-weight: 700;
    border-bottom-color: var(--green-dark);
  }

  /* ORDER LIST */
  .order-list {
    padding: 16px 16px 0;
    display: flex; flex-direction: column; gap: 12px;
  }

  /* ORDER CARD */
  .order-card {
    background: var(--bg-card);
    border-radius: var(--radius-card);
    box-shadow: var(--shadow-card);
    overflow: hidden;
    cursor: pointer;
    transition: box-shadow 0.15s;
  }
  .order-card:active { box-shadow: 0 1px 6px rgba(0,0,0,0.08); }

  /* CARD HEADER */
  .order-card-header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 12px 14px 10px;
    border-bottom: 1px solid var(--border);
  }
  .order-card-header-left { display: flex; flex-direction: column; gap: 3px; }
  .order-number { font-size: 11px; color: var(--text-sub); }
  .order-date { font-size: 12px; font-weight: 600; color: var(--text-main); }
  .order-status {
    font-size: 11px; font-weight: 700;
    padding: 4px 10px; border-radius: 20px;
    white-space: nowrap;
  }
  .order-status.delivered { background: var(--green-light); color: var(--green-dark); }
  .order-status.shipping  { background: #FFF3CD; color: #856404; }
  .order-status.preparing { background: #E8F0FE; color: #1A56DB; }
  .order-status.cancelled { background: #F5F5F5; color: #999; }

  /* SHOP INFO */
  .order-shop-row {
    display: flex; align-items: center; gap: 8px;
    padding: 10px 14px 0;
  }
  .order-shop-logo {
    width: 24px; height: 24px; border-radius: 6px;
    border: 1px dashed var(--border); background: var(--bg);
    display: flex; align-items: center; justify-content: center;
    font-size: 7px; color: var(--text-sub); text-align: center;
    line-height: 1.2; flex-shrink: 0;
  }
  .order-shop-name { font-size: 12px; font-weight: 600; color: var(--text-main); }

  /* PRODUCTS */
  .order-products {
    padding: 8px 14px 12px;
    display: flex; flex-direction: column; gap: 8px;
  }
  .order-product-row {
    display: flex; align-items: center; gap: 10px;
  }
  .order-product-thumb {
    width: 52px; height: 52px; border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
    font-size: 24px; flex-shrink: 0;
  }
  .order-product-thumb.g1 { background: linear-gradient(135deg,#f0e8d0,#d8c8a0); }
  .order-product-thumb.g2 { background: linear-gradient(135deg,#e0e8d0,#b8c890); }
  .order-product-thumb.g3 { background: linear-gradient(135deg,#f4ead8,#d4c0a0); }
  .order-product-thumb.g4 { background: linear-gradient(135deg,#ece8e0,#c8c0b0); }
  .order-product-info { flex: 1; }
  .order-product-name {
    font-size: 13px; font-weight: 600;
    color: var(--text-main); line-height: 1.4; margin-bottom: 2px;
  }
  .order-product-meta { font-size: 11px; color: var(--text-sub); }
  .order-product-price { font-size: 13px; font-weight: 700; white-space: nowrap; }

  /* MORE PRODUCTS */
  .order-more-products {
    display: flex; align-items: center; gap: 6px;
    padding: 0 14px 10px;
    font-size: 12px; color: var(--text-sub);
  }
  .order-more-thumbs { display: flex; gap: 4px; }
  .order-more-thumb {
    width: 32px; height: 32px; border-radius: 6px;
    display: flex; align-items: center; justify-content: center;
    font-size: 14px;
  }
  .order-more-thumb.g2 { background: linear-gradient(135deg,#e0e8d0,#b8c890); }
  .order-more-thumb.g4 { background: linear-gradient(135deg,#ece8e0,#c8c0b0); }

  /* CARD FOOTER */
  .order-card-footer {
    display: flex; align-items: center; justify-content: space-between;
    padding: 10px 14px 12px;
    border-top: 1px solid var(--border);
    background: var(--bg);
  }
  .order-total-wrap { display: flex; flex-direction: column; gap: 3px; }
  .order-total-label { font-size: 10px; color: var(--text-sub); }
  .order-total-amount { font-size: 16px; font-weight: 700; color: var(--text-main); }
  .order-footer-right { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; }
  .order-point-pill {
    font-size: 10px; color: var(--green-dark);
    background: var(--green-light);
    border-radius: 10px; padding: 3px 10px; font-weight: 600;
  }
  .order-detail-link {
    font-size: 11px; color: var(--green-mid);
    display: flex; align-items: center; gap: 2px;
  }
  .order-detail-link svg {
    width: 12px; height: 12px;
    stroke: var(--green-mid); fill: none;
    stroke-width: 2; stroke-linecap: round; stroke-linejoin: round;
  }

  /* REORDER BTN */
  .reorder-btn {
    width: calc(100% - 28px);
    margin: 0 14px 12px;
    height: 38px; border-radius: 20px;
    border: 1.5px solid var(--green-dark);
    background: transparent; color: var(--green-dark);
    font-size: 13px; font-weight: 700;
    cursor: pointer; transition: background 0.15s;
  }
  .reorder-btn:active { background: var(--green-light); }



  /* EMPTY STATE */
  .empty-state {
    display: none; padding: 80px 24px 40px;
    text-align: center; flex-direction: column; align-items: center;
  }
  .empty-state.visible { display: flex; }
  .empty-icon { font-size: 52px; margin-bottom: 20px; }
  .empty-title { font-size: 18px; font-weight: 700; margin-bottom: 8px; }
  .empty-sub { font-size: 13px; color: var(--text-sub); line-height: 1.8; margin-bottom: 28px; }
  .empty-btn {
    height: 48px; border-radius: 24px;
    background: var(--green-dark); color: #fff;
    font-size: 14px; font-weight: 700;
    padding: 0 28px; cursor: pointer; border: none;
  }

  /* BOTTOM NAV */
  .bottom-nav {
    position: fixed; bottom: 0; left: 50%; transform: translateX(-50%);
    width: 100%; max-width: 430px;
    background: var(--bg-card); border-top: 1px solid var(--border);
    display: flex; z-index: 200;
  }
  .nav-item {
    flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px;
    padding: 10px 0 14px; color: var(--text-sub);
    font-size: 10px; letter-spacing: 0.04em; cursor: pointer;
  }
  .nav-item.active { color: var(--green-dark); }
  .nav-item svg {
    width: 22px; height: 22px;
    stroke: currentColor; fill: none;
    stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round;
  }

  /* TOAST */
  .toast {
    position: fixed; bottom: 80px; left: 50%; transform: translateX(-50%);
    background: var(--green-dark); color: #fff;
    font-size: 13px; font-weight: 600;
    padding: 10px 24px; border-radius: 20px;
    z-index: 400; opacity: 0; pointer-events: none;
    transition: opacity 0.2s; white-space: nowrap;
  }
  .toast.show { opacity: 1; }
  /* ============ DESKTOP (≥900px) ============ */
  .header-icons-desktop { display: none; }
  .header-icons-desktop a { display: flex; }
  .header-icons-desktop svg {
    width: 20px; height: 20px;
    stroke: var(--text-main); fill: none;
    stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round;
  }
  @media (min-width: 900px) {
    .header { justify-content: flex-start; gap: 20px; }
    .header-icons-desktop { margin-left: auto; }
    .header-spacer { display: none; }
    .header-icons-desktop { display: flex; align-items: center; gap: 16px; }
    .bottom-nav { display: none; }
    body { max-width: 720px; padding-bottom: 80px; }
    .header { padding: 16px 32px; }
  }
</style>
</head>
<body>

<!-- HEADER -->
<header class="header">
  <button class="header-back" onclick="history.back()">
    <svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg>
  </button>
  <div class="header-title">注文履歴</div>
  <div class="header-spacer"></div>
<div class="header-icons-desktop">
  <a href="komcho-market-search.html"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg></a>
  <a href="komcho-market-favorites.html"><svg viewBox="0 0 24 24"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg></a>
  <a href="komcho-market-cart.html"><svg viewBox="0 0 24 24"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg></a>
  <a href="komcho-market-orders.html"><svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg></a>
  <a href="komcho-market-mypage.html"><svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg></a>
</div>
</header>

<!-- FILTER TABS -->
<div class="filter-tabs">
  <div class="filter-tab active" onclick="filterOrders('all', this)">すべて</div>
  <div class="filter-tab" onclick="filterOrders('new', this)">準備中</div>
  <div class="filter-tab" onclick="filterOrders('shipped', this)">発送済み</div>
  <div class="filter-tab" onclick="filterOrders('cancelled', this)">キャンセル</div>
</div>

<!-- ORDER LIST -->
<div class="order-list" id="orderList">
  <p style="text-align:center;padding:40px 16px;font-size:13px;color:var(--text-sub);">読み込み中...</p>
</div>
<!-- EMPTY STATE -->
<div class="empty-state" id="emptyState">
  <div class="empty-icon">📦</div>
  <div class="empty-title">注文がありません</div>
  <div class="empty-sub">このカテゴリーに<br>該当する注文はありません</div>
  <button class="empty-btn" onclick="filterOrders('all', document.querySelector('.filter-tab'))">すべて表示</button>
</div>

<!-- BOTTOM NAV -->
<nav class="bottom-nav">
  <a class="nav-item" href="komcho-market-top.html">
    <svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
    <span>ホーム</span>
  </a>
  <a class="nav-item" href="komcho-market-search.html">
    <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
    <span>探す</span>
  </a>
  <a class="nav-item" href="komcho-market-favorites.html">
    <svg viewBox="0 0 24 24"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
    <span>お気に入り</span>
  </a>
  <a class="nav-item" href="komcho-market-cart.html">
    <svg viewBox="0 0 24 24"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg>
    <span>カゴ</span>
  </a>
  <a class="nav-item active" href="komcho-market-mypage.html">
    <svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
    <span>マイページ</span>
  </a>
</nav>

<!-- TOAST -->
<div class="toast" id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
  const SUPABASE_URL = 'https://uawhrpizzlchkvmzrjzo.supabase.co';
  const SUPABASE_KEY = 'sb_publishable_FaOqUE1PDbo-fpT9KhkWaw__BShLngI';
  const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  const statusLabelMap = { new: '準備中', shipped: '発送済み', cancelled: 'キャンセル' };
  const orderThumbClasses = ['g1', 'g2', 'g3'];
  let allOrders = [];

  (async function initOrders() {
    const { data: { session } } = await supabaseClient.auth.getSession();
    if (!session) {
      window.location.href = 'komcho-market-login.html';
      return;
    }

    const { data, error } = await supabaseClient
      .from('orders')
      .select('*, shops(shop_name, logo_url), order_items(*)')
      .eq('user_id', session.user.id)
      .order('created_at', { ascending: false });

    if (error) {
      console.error('注文履歴取得エラー:', error);
      document.getElementById('orderList').innerHTML = '<p style="text-align:center;padding:40px 16px;font-size:13px;color:var(--text-sub);">読み込みに失敗しました</p>';
      return;
    }

    allOrders = data || [];
    renderOrders('all');
  })();

  function renderOrders(status) {
    const list = document.getElementById('orderList');
    const filtered = status === 'all' ? allOrders : allOrders.filter(o => o.status === status);

    document.getElementById('emptyState').classList.toggle('visible', filtered.length === 0);
    list.style.display = filtered.length === 0 ? 'none' : 'flex';
    if (filtered.length === 0) { list.innerHTML = ''; return; }

    list.innerHTML = filtered.map(order => {
      const dateStr = new Date(order.created_at).toLocaleDateString('ja-JP', { year: 'numeric', month: 'long', day: 'numeric' });
      const statusLabel = statusLabelMap[order.status] || order.status;
      const productsHtml = (order.order_items || []).map((item, i) => {
        const thumbClass = orderThumbClasses[i % orderThumbClasses.length];
        const thumbInner = item.product_image
          ? `<img src="${item.product_image}" style="width:100%;height:100%;object-fit:cover;border-radius:inherit;">`
          : '🛍️';
        return `
          <div class="order-product-row">
            <div class="order-product-thumb ${thumbClass}" style="overflow:hidden;">${thumbInner}</div>
            <div class="order-product-info">
              <div class="order-product-name">${item.product_name}</div>
              <div class="order-product-meta">数量：${item.quantity}</div>
            </div>
            <div class="order-product-price">¥${(item.price * item.quantity).toLocaleString()}</div>
          </div>
        `;
      }).join('');

      const logoInner = order.shops?.logo_url
        ? `<img src="${order.shops.logo_url}" style="width:100%;height:100%;object-fit:cover;border-radius:inherit;">`
        : 'SHOP';

      const footerRight = order.status === 'cancelled'
        ? `<a class="order-detail-link" href="komcho-market-order-detail.html?id=${order.id}" style="text-decoration:none;">詳細を見る<svg viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"/></svg></a>`
        : `<div class="order-point-pill">🌿 +${order.points_earned}pt 獲得予定</div><a class="order-detail-link" href="komcho-market-order-detail.html?id=${order.id}" style="text-decoration:none;">詳細を見る<svg viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"/></svg></a>`;

      return `
        <div class="order-card" data-status="${order.status}">
          <div class="order-card-header">
            <div class="order-card-header-left">
              <div class="order-number">注文 #${order.id.slice(0, 8).toUpperCase()}</div>
              <div class="order-date">${dateStr}</div>
            </div>
            <div class="order-status ${order.status}">${statusLabel}</div>
          </div>
          <div class="order-shop-row">
            <div class="order-shop-logo" style="overflow:hidden;">${logoInner}</div>
            <div class="order-shop-name">${order.shops?.shop_name || ''}</div>
          </div>
          <div class="order-products">
            ${productsHtml}
          </div>

          ${order.status === 'shipped' ? `<button class="reorder-btn" onclick="reorder('${order.id}')">同じ商品を再注文する</button>` : ''}
          <div class="order-card-footer">
            <div class="order-total-wrap">
              <div class="order-total-label">${order.status === 'cancelled' ? 'キャンセル金額' : 'お支払い金額'}</div>
              <div class="order-total-amount" style="${order.status === 'cancelled' ? 'color:var(--text-sub);' : ''}">¥${order.total.toLocaleString()}</div>
            </div>
            <div class="order-footer-right">
              ${footerRight}
            </div>
          </div>
        </div>
      `;
    }).join('');
  }

  function filterOrders(status, tabEl) {
    document.querySelectorAll('.filter-tab').forEach(t => t.classList.remove('active'));
    tabEl.classList.add('active');
    renderOrders(status);
  }

  // 再注文：この注文の商品をもう一度カゴに追加する
  async function reorder(orderId) {
    const { data: { session } } = await supabaseClient.auth.getSession();
    if (!session) return;
    const order = allOrders.find(o => o.id === orderId);
    if (!order) return;

    for (const item of order.order_items) {
      const { data: existing } = await supabaseClient
        .from('cart_items')
        .select('id, quantity')
        .eq('user_id', session.user.id)
        .eq('product_id', item.product_id)
        .maybeSingle();

      if (existing) {
        await supabaseClient.from('cart_items').update({ quantity: existing.quantity + item.quantity }).eq('id', existing.id);
      } else {
        await supabaseClient.from('cart_items').insert({ user_id: session.user.id, product_id: item.product_id, quantity: item.quantity });
      }
    }
    showToast('カゴに追加しました');
  }

  function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg; t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 2500);
  }
</script>
</body>
</html>
