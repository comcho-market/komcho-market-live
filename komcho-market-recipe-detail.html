<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>レシピ - こむちょマーケット</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 48 48%27%3E%3Crect width=%2748%27 height=%2748%27 rx=%2710%27 fill=%27%233D5A3E%27/%3E%3Cg transform=%27translate(24,24) scale(0.55)%27%3E%3Cpath d=%27M -26 7 C -17 -17 5 -24 24 -10 C 12 5 -2 19 -21 24%27 fill=%27none%27 stroke=%27%23F8F5EF%27 stroke-width=%275%27 stroke-linecap=%27round%27 stroke-linejoin=%27round%27/%3E%3C/g%3E%3C/svg%3E">
<style>
  :root {
    --bg:#F8F5EF; --bg-card:#FFFFFF; --green-dark:#3D5A3E; --green-mid:#5A7A5B;
    --green-light:#EAF0E8; --gold:#B8973A; --text-main:#2C2C2C; --text-sub:#6B6B6B;
    --border:#E2DDD5; --radius-card:12px; --shadow-card:0 2px 12px rgba(0,0,0,0.07);
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Hiragino Kaku Gothic ProN','Hiragino Sans','Yu Gothic','Meiryo',sans-serif;
    background: var(--bg); color: var(--text-main);
    max-width: 430px; margin: 0 auto; min-height: 100vh; padding-bottom: 100px;
  }
  a { text-decoration: none; color: inherit; }
  button { cursor: pointer; border: none; background: none; font-family: inherit; }

  .header {
    position: sticky; top: 0; z-index: 100;
    background: var(--bg); border-bottom: 1px solid var(--border);
    display: flex; align-items: center; justify-content: space-between;
    padding: 12px 16px;
  }
  .header-back {
    width: 32px; height: 32px; display: flex; align-items: center; justify-content: center;
  }
  .header-back svg { width: 22px; height: 22px; stroke: var(--text-main); fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  .header-title { font-size: 15px; font-weight: 700; }
  .header-spacer { width: 32px; }

  .cover-photo { width: 100%; height: auto; background: var(--green-light); display: block; }

  .post-header { padding: 20px 20px 16px; }
  .post-title { font-size: 19px; font-weight: 700; line-height: 1.5; margin-bottom: 8px; }
  .post-date { font-size: 11px; color: var(--text-sub); margin-bottom: 14px; }
  .post-intro { font-size: 13.5px; line-height: 1.9; color: var(--text-main); }

  .ig-link {
    display: inline-flex; align-items: center; gap: 6px;
    margin-top: 14px; font-size: 12.5px; font-weight: 700; color: var(--green-dark);
    border: 1.5px solid var(--green-dark); border-radius: 20px; padding: 8px 16px;
  }
  .ig-link svg { width: 16px; height: 16px; stroke: var(--green-dark); fill: none; stroke-width: 1.8; }

  .dish-list { padding: 8px 16px 0; display: flex; flex-direction: column; gap: 24px; }
  .dish-card {
    background: var(--bg-card); border-radius: var(--radius-card);
    box-shadow: var(--shadow-card); overflow: hidden;
  }
  .dish-photo { width: 100%; aspect-ratio: 4/3; object-fit: cover; background: var(--green-light); display: block; }
  .dish-body { padding: 16px; }
  .dish-name { font-size: 15.5px; font-weight: 700; margin-bottom: 8px; }
  .dish-desc { font-size: 13px; line-height: 1.8; color: var(--text-main); margin-bottom: 14px; }

  .dish-sub-block { margin-bottom: 14px; }
  .dish-sub-title {
    font-size: 11.5px; font-weight: 700; color: var(--green-dark);
    margin-bottom: 6px; display: flex; align-items: center; gap: 4px;
  }
  .dish-sub-body {
    font-size: 12.5px; line-height: 1.85; color: var(--text-main);
    white-space: pre-wrap; background: var(--green-light);
    border-radius: 8px; padding: 10px 12px;
  }

  .dish-product-link {
    display: flex; align-items: center; gap: 10px;
    background: var(--bg); border: 1.5px solid var(--border);
    border-radius: 10px; padding: 10px 12px; margin-top: 4px;
  }
  .dish-product-thumb { width: 44px; height: 44px; border-radius: 8px; object-fit: cover; background: var(--green-light); flex-shrink: 0; }
  .dish-product-info { flex: 1; min-width: 0; }
  .dish-product-label { font-size: 10px; color: var(--text-sub); margin-bottom: 2px; }
  .dish-product-name { font-size: 12.5px; font-weight: 700; }
  .dish-product-arrow { width: 16px; height: 16px; stroke: var(--text-sub); fill: none; stroke-width: 2; flex-shrink: 0; }

  .dish-ig-link {
    display: inline-flex; align-items: center; gap: 5px;
    margin-top: 12px; font-size: 11.5px; font-weight: 700; color: var(--green-dark);
  }
  .dish-ig-link svg { width: 14px; height: 14px; stroke: var(--green-dark); fill: none; stroke-width: 1.8; }

  .empty-state { text-align: center; padding: 60px 16px; color: var(--text-sub); font-size: 13px; }

  .bottom-nav {
    position: fixed; bottom: 0; left: 50%; transform: translateX(-50%);
    width: 100%; max-width: 430px;
    background: var(--bg-card); border-top: 1px solid var(--border);
    display: flex; z-index: 200;
  }
  .nav-item {
    flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px;
    padding: 10px 0 14px; color: var(--text-sub);
    font-size: 10px; letter-spacing: 0.04em; cursor: pointer;
  }
  .nav-item svg {
    width: 22px; height: 22px;
    stroke: currentColor; fill: none;
    stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round;
  }
  /* ============ DESKTOP (≥900px) ============ */
  .header-icons-desktop { display: none; }
  .header-icons-desktop a { display: flex; }
  .header-icons-desktop svg {
    width: 20px; height: 20px;
    stroke: var(--text-main); fill: none;
    stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round;
  }
  @media (min-width: 900px) {
    .header { justify-content: flex-start; gap: 20px; }
    .header-icons-desktop { margin-left: auto; }
    .header-spacer { display: none; }
    .header-icons-desktop { display: flex; align-items: center; gap: 16px; }
    .bottom-nav { display: none; }
    body { max-width: 600px; padding-bottom: 80px; }
    .header { padding: 16px 32px; }
  }
</style>
</head>
<body>

<!-- HEADER -->
<header class="header">
  <button class="header-back" onclick="history.back()">
    <svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg>
  </button>
  <div class="header-title">レシピ</div>
  <div class="header-spacer"></div>
<div class="header-icons-desktop">
  <a href="komcho-market-search.html"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg></a>
  <a href="komcho-market-favorites.html"><svg viewBox="0 0 24 24"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg></a>
  <a href="komcho-market-cart.html"><svg viewBox="0 0 24 24"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg></a>
  <a href="komcho-market-orders.html"><svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg></a>
  <a href="komcho-market-mypage.html"><svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg></a>
</div>
</header>

<div id="postContent">
  <p style="text-align:center;padding:60px 16px;font-size:13px;color:var(--text-sub);">読み込み中...</p>
</div>

<!-- BOTTOM NAV -->
<nav class="bottom-nav">
  <a class="nav-item" href="komcho-market-top.html">
    <svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
    <span>ホーム</span>
  </a>
  <a class="nav-item" href="komcho-market-search.html">
    <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
    <span>探す</span>
  </a>
  <a class="nav-item" href="komcho-market-favorites.html">
    <svg viewBox="0 0 24 24"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
    <span>お気に入り</span>
  </a>
  <a class="nav-item" href="komcho-market-cart.html">
    <svg viewBox="0 0 24 24"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg>
    <span>カゴ</span>
  </a>
  <a class="nav-item" href="komcho-market-orders.html">
    <svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>
    <span>履歴</span>
  </a>
</nav>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
  const SUPABASE_URL = 'https://uawhrpizzlchkvmzrjzo.supabase.co';
  const SUPABASE_KEY = 'sb_publishable_FaOqUE1PDbo-fpT9KhkWaw__BShLngI';
  const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  const igIcon = `<svg viewBox="0 0 24 24"><rect x="2" y="2" width="20" height="20" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="0.5" fill="currentColor"/></svg>`;

  (async function loadPost() {
    const postId = new URLSearchParams(window.location.search).get('id');
    const content = document.getElementById('postContent');

    if (!postId) {
      content.innerHTML = '<div class="empty-state">レシピが見つかりませんでした。</div>';
      return;
    }

    const { data: post, error } = await supabaseClient
      .from('recipe_posts')
      .select('*')
      .eq('id', postId)
      .single();

    if (error || !post) {
      content.innerHTML = '<div class="empty-state">レシピが見つかりませんでした。</div>';
      return;
    }

    document.title = `${post.title} - こむちょマーケット`;

    const { data: dishes } = await supabaseClient
      .from('recipe_dishes')
      .select('*, products(id, name, image_url, price)')
      .eq('post_id', postId)
      .order('sort_order', { ascending: true });

    const dateStr = new Date(post.created_at).toLocaleDateString('ja-JP', { year: 'numeric', month: 'long', day: 'numeric' });

    const coverHtml = post.cover_image
      ? `<img class="cover-photo" src="${post.cover_image}" alt="${post.title}">`
      : '<div class="cover-photo" style="min-height:160px;"></div>';
    const igHtml = post.instagram_url
      ? `<a class="ig-link" href="${post.instagram_url}" target="_blank" rel="noopener">${igIcon}Instagramで見る</a>`
      : '';

    const dishesHtml = (dishes || []).map(dish => {
      const photoHtml = dish.image ? `<img class="dish-photo" src="${dish.image}" alt="${dish.name}">` : '';
      const descHtml = dish.description ? `<div class="dish-desc">${dish.description}</div>` : '';
      const ingredientsHtml = dish.ingredients
        ? `<div class="dish-sub-block"><div class="dish-sub-title">🥬 材料</div><div class="dish-sub-body">${dish.ingredients}</div></div>` : '';
      const instructionsHtml = dish.instructions
        ? `<div class="dish-sub-block"><div class="dish-sub-title">📝 作り方</div><div class="dish-sub-body">${dish.instructions}</div></div>` : '';
      const product = dish.products;
      const productHtml = product ? `
        <a class="dish-product-link" href="komcho-market-product.html?id=${product.id}">
          ${product.image_url ? `<img class="dish-product-thumb" src="${product.image_url}">` : '<div class="dish-product-thumb"></div>'}
          <div class="dish-product-info">
            <div class="dish-product-label">使用した商品</div>
            <div class="dish-product-name">${product.name}</div>
          </div>
          <svg class="dish-product-arrow" viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"/></svg>
        </a>` : '';
      const dishIgHtml = dish.instagram_url
        ? `<a class="dish-ig-link" href="${dish.instagram_url}" target="_blank" rel="noopener">${igIcon}この料理をInstagramで見る</a>` : '';

      return `
        <div class="dish-card">
          ${photoHtml}
          <div class="dish-body">
            <div class="dish-name">${dish.name}</div>
            ${descHtml}
            ${ingredientsHtml}
            ${instructionsHtml}
            ${productHtml}
            ${dishIgHtml}
          </div>
        </div>
      `;
    }).join('');

    content.innerHTML = `
      ${coverHtml}
      <div class="post-header">
        <div class="post-title">${post.title}</div>
        <div class="post-date">${dateStr}</div>
        ${post.intro ? `<div class="post-intro">${post.intro}</div>` : ''}
        ${igHtml}
      </div>
      <div class="dish-list">
        ${dishesHtml || '<p style="font-size:12px;color:var(--text-sub);padding:8px 0;">まだ料理が登録されていません。</p>'}
      </div>
    `;
  })();
</script>
</body>
</html>
