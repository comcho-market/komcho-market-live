<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>カゴ - こむちょマーケット</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 48 48%27%3E%3Crect width=%2748%27 height=%2748%27 rx=%2710%27 fill=%27%233D5A3E%27/%3E%3Cg transform=%27translate(24,24) scale(0.55)%27%3E%3Cpath d=%27M -26 7 C -17 -17 5 -24 24 -10 C 12 5 -2 19 -21 24%27 fill=%27none%27 stroke=%27%23F8F5EF%27 stroke-width=%275%27 stroke-linecap=%27round%27 stroke-linejoin=%27round%27/%3E%3C/g%3E%3C/svg%3E">
<style>
  :root {
    --bg:          #F8F5EF;
    --bg-card:     #FFFFFF;
    --green-dark:  #3D5A3E;
    --green-mid:   #5A7A5B;
    --green-light: #EAF0E8;
    --gold:        #B8973A;
    --text-main:   #2C2C2C;
    --text-sub:    #6B6B6B;
    --border:      #E2DDD5;
    --radius-card: 12px;
    --shadow-card: 0 2px 12px rgba(0,0,0,0.07);
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', 'Yu Gothic', 'Meiryo', sans-serif;
    background: var(--bg);
    color: var(--text-main);
    max-width: 430px;
    margin: 0 auto;
    min-height: 100vh;
    padding-bottom: 80px;
  }
  a { text-decoration: none; color: inherit; }
  button { cursor: pointer; border: none; background: none; font-family: inherit; }

  /* HEADER */
  .header {
    position: sticky; top: 0; z-index: 100;
    background: var(--bg);
    border-bottom: 1px solid var(--border);
    display: flex; align-items: center; justify-content: space-between;
    padding: 12px 16px;
  }
  .header-logo {
    display: flex; align-items: center; gap: 7px;
  }
  .header-logo .logo-icon {
    width: 24px; height: 19px; flex-shrink: 0;
  }
  .header-logo .logo-icon path {
    fill: none; stroke: var(--green-dark);
    stroke-width: 3; stroke-linecap: round; stroke-linejoin: round;
  }
  .header-logo .logo-text {
    font-size: 15px; font-weight: 700; letter-spacing: 0.04em;
    color: var(--text-main);
  }
  .header-title { font-size: 15px; font-weight: 700; letter-spacing: 0.04em; }
  .header-spacer { width: 50px; }

  /* GAP */
  .gap { height: 8px; background: var(--bg); }

  /* SHOP CART BLOCK */
  .shop-cart-block {
    background: var(--bg-card);
    border-bottom: 1px solid var(--border);
    margin-bottom: 0;
  }

  /* SHOP HEADER */
  .shop-cart-header {
    display: flex; align-items: center; gap: 10px;
    padding: 14px 16px 10px;
    border-bottom: 1px solid var(--border);
  }
  .shop-cart-logo {
    width: 32px; height: 32px; border-radius: 8px;
    border: 1px dashed var(--border); background: var(--bg);
    display: flex; align-items: center; justify-content: center;
    font-size: 8px; color: var(--text-sub); text-align: center;
    line-height: 1.2; flex-shrink: 0;
  }
  .shop-cart-name { font-size: 13px; font-weight: 700; flex: 1; }
  .shop-cart-count { font-size: 11px; color: var(--text-sub); }

  /* CART ITEMS */
  .cart-items { padding: 0 16px; }
  .cart-item {
    display: flex; align-items: flex-start; gap: 12px;
    padding: 14px 0;
    border-bottom: 1px solid var(--border);
  }
  .cart-item:last-child { border-bottom: none; }
  .cart-item-img {
    width: 72px; height: 72px; border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
    font-size: 32px; flex-shrink: 0;
  }
  .cart-item-img.g1 { background: linear-gradient(135deg,#f0e8d0,#d8c8a0); }
  .cart-item-img.g2 { background: linear-gradient(135deg,#e0e8d0,#b8c890); }
  .cart-item-img.g3 { background: linear-gradient(135deg,#f4ead8,#d4c0a0); }
  .cart-item-img.g4 { background: linear-gradient(135deg,#ece8e0,#c8c0b0); }
  .cart-item-info { flex: 1; }
  .cart-item-name {
    font-size: 13px; font-weight: 600;
    line-height: 1.4; color: var(--text-main);
    margin-bottom: 4px;
  }
  .cart-item-tags { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 8px; }
  .cart-item-tag {
    font-size: 9px; background: var(--green-light);
    color: var(--green-dark); border-radius: 20px;
    padding: 2px 7px; font-weight: 500;
  }
  .cart-item-price {
    font-size: 15px; font-weight: 700;
    color: var(--text-main); margin-bottom: 8px;
  }
  .cart-item-controls {
    display: flex; align-items: center; gap: 0;
  }
  .qty-btn {
    width: 30px; height: 30px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--bg-card);
    display: flex; align-items: center; justify-content: center;
    font-size: 16px; color: var(--green-dark); font-weight: 500;
    cursor: pointer;
  }
  .qty-num {
    width: 36px; text-align: center;
    font-size: 15px; font-weight: 700;
    color: var(--text-main);
  }
  .cart-item-delete {
    margin-left: auto;
    display: flex; align-items: center; justify-content: center;
    width: 30px; height: 30px;
    cursor: pointer;
  }
  .cart-item-delete svg {
    width: 16px; height: 16px;
    stroke: var(--text-sub); fill: none;
    stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round;
  }

  /* SHOP SUMMARY */
  .shop-summary {
    padding: 14px 16px;
    background: var(--bg);
    border-top: 1px solid var(--border);
  }
  .shop-summary-row {
    display: flex; align-items: center; justify-content: space-between;
    font-size: 13px; color: var(--text-sub);
    margin-bottom: 6px;
  }
  .shop-summary-row:last-child { margin-bottom: 0; }
  .shop-summary-row.total {
    font-size: 15px; font-weight: 700;
    color: var(--text-main); margin-top: 10px;
    padding-top: 10px; border-top: 1px solid var(--border);
  }
  .delivery-type-badge {
    font-size: 10px; background: var(--bg-card);
    border: 1px solid var(--border); border-radius: 10px;
    padding: 2px 8px; color: var(--text-sub);
  }
  .free-shipping-note {
    font-size: 11px; color: var(--green-dark);
    background: var(--green-light);
    border-radius: 8px; padding: 8px 12px;
    margin-top: 10px; line-height: 1.6;
    display: flex; align-items: center; gap: 6px;
  }

  /* POINT USE */
  .point-use-block {
    background: var(--bg-card);
    border-bottom: 1px solid var(--border);
    padding: 16px;
  }
  .point-use-header {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 12px;
  }
  .point-use-title {
    font-size: 14px; font-weight: 700;
    display: flex; align-items: center; gap: 6px;
  }
  .point-use-title svg {
    width: 16px; height: 16px;
    stroke: var(--green-dark); fill: none;
    stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round;
  }
  .point-balance {
    font-size: 12px; color: var(--text-sub);
  }
  .point-balance strong { color: var(--green-dark); font-weight: 700; }
  .point-use-row {
    display: flex; align-items: center; gap: 10px;
  }
  .point-use-toggle {
    display: flex; align-items: center; gap: 8px;
    font-size: 13px; color: var(--text-main);
    cursor: pointer;
  }
  .toggle-switch {
    width: 44px; height: 24px; border-radius: 12px;
    background: var(--border); position: relative;
    transition: background 0.2s; flex-shrink: 0;
    cursor: pointer;
  }
  .toggle-switch.on { background: var(--green-dark); }
  .toggle-knob {
    width: 20px; height: 20px; border-radius: 50%;
    background: #fff; position: absolute;
    top: 2px; left: 2px;
    transition: left 0.2s;
    box-shadow: 0 1px 4px rgba(0,0,0,0.15);
  }
  .toggle-switch.on .toggle-knob { left: 22px; }
  .point-use-amount {
    font-size: 13px; color: var(--green-dark);
    font-weight: 700; margin-left: auto;
  }

  /* CHECKOUT BTN */
  .checkout-block {
    background: var(--bg-card);
    padding: 16px;
    border-bottom: 1px solid var(--border);
  }
  .checkout-summary {
    display: flex; flex-direction: column; gap: 6px;
    margin-bottom: 14px;
  }
  .checkout-row {
    display: flex; justify-content: space-between;
    font-size: 13px; color: var(--text-sub);
  }
  .checkout-row.grand-total {
    font-size: 18px; font-weight: 700;
    color: var(--text-main);
    padding-top: 10px; margin-top: 4px;
    border-top: 1px solid var(--border);
  }
  .checkout-point-earn {
    font-size: 11px; color: var(--green-dark);
    background: var(--green-light);
    border-radius: 8px; padding: 8px 12px;
    margin-bottom: 14px;
    display: flex; align-items: center; gap: 6px;
  }
  .checkout-btn {
    width: 100%; height: 52px; border-radius: 26px;
    background: var(--green-dark); color: #fff;
    font-size: 16px; font-weight: 700; letter-spacing: 0.04em;
    cursor: pointer; border: none;
    transition: opacity 0.15s;
    display: flex; align-items: center; justify-content: center; gap: 8px;
  }
  .checkout-btn:active { opacity: 0.85; }
  .checkout-btn svg {
    width: 18px; height: 18px;
    stroke: #fff; fill: none;
    stroke-width: 2; stroke-linecap: round; stroke-linejoin: round;
  }
  .checkout-note {
    text-align: center;
    font-size: 11px; color: var(--text-sub);
    margin-top: 10px; line-height: 1.6;
  }

  /* GUEST NOTICE */
  .guest-notice {
    margin: 0 16px;
    background: #FFF9EC;
    border: 1px solid #E8D898;
    border-radius: var(--radius-card);
    padding: 14px 16px;
    margin-bottom: 8px;
  }
  .guest-notice-title {
    font-size: 13px; font-weight: 700;
    color: var(--text-main); margin-bottom: 6px;
    display: flex; align-items: center; gap: 6px;
  }
  .guest-notice-text {
    font-size: 12px; color: var(--text-sub); line-height: 1.7;
    margin-bottom: 10px;
  }
  .guest-notice-btn {
    display: inline-block;
    background: var(--green-dark); color: #fff;
    font-size: 12px; font-weight: 700;
    padding: 7px 16px; border-radius: 20px;
    cursor: pointer;
  }

  /* CONTINUE SHOPPING */
  .continue-wrap {
    padding: 16px;
    text-align: center;
  }
  .continue-link {
    font-size: 13px; color: var(--green-mid);
    display: flex; align-items: center; justify-content: center; gap: 4px;
    cursor: pointer;
  }
  .continue-link svg {
    width: 14px; height: 14px;
    stroke: var(--green-mid); fill: none;
    stroke-width: 2; stroke-linecap: round; stroke-linejoin: round;
  }

  /* EMPTY STATE */
  .empty-state {
    display: none;
    padding: 80px 24px 40px;
    text-align: center;
    flex-direction: column; align-items: center;
  }
  .empty-state.visible { display: flex; }
  .empty-icon { font-size: 52px; margin-bottom: 20px; }
  .empty-title { font-size: 18px; font-weight: 700; margin-bottom: 8px; }
  .empty-sub { font-size: 13px; color: var(--text-sub); line-height: 1.8; margin-bottom: 28px; }
  .empty-btn {
    height: 48px; border-radius: 24px;
    background: var(--green-dark); color: #fff;
    font-size: 14px; font-weight: 700;
    padding: 0 28px; cursor: pointer; border: none;
  }

  /* BOTTOM NAV */
  .bottom-nav {
    position: fixed; bottom: 0; left: 50%; transform: translateX(-50%);
    width: 100%; max-width: 430px;
    background: var(--bg-card); border-top: 1px solid var(--border);
    display: flex; z-index: 200;
  }
  .nav-item {
    flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px;
    padding: 10px 0 14px; color: var(--text-sub);
    font-size: 10px; letter-spacing: 0.04em; cursor: pointer;
  }
  .nav-item.active { color: var(--green-dark); }
  .nav-item svg {
    width: 22px; height: 22px;
    stroke: currentColor; fill: none;
    stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round;
  }
  .cart-wrap { position: relative; }
  .cart-badge {
    position: absolute; top: -5px; right: -6px;
    background: var(--green-dark); color: #fff;
    font-size: 9px; font-weight: 700;
    width: 16px; height: 16px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
  }

  /* TOAST */
  .toast {
    position: fixed; bottom: 80px; left: 50%; transform: translateX(-50%);
    background: var(--green-dark); color: #fff;
    font-size: 13px; font-weight: 600;
    padding: 10px 24px; border-radius: 20px;
    z-index: 400; opacity: 0; pointer-events: none;
    transition: opacity 0.2s; white-space: nowrap;
  }
  .toast.show { opacity: 1; }

  /* ============ DESKTOP (≥900px) ============ */
  .header-icons-desktop { display: none; }
  .header-icons-desktop a { display: flex; }
  .header-icons-desktop svg {
    width: 20px; height: 20px;
    stroke: var(--text-main); fill: none;
    stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round;
  }
  @media (min-width: 900px) {
    .header { justify-content: flex-start; gap: 20px; }
    .header-icons-desktop { margin-left: auto; }
    .header-spacer { display: none; }
    .header-icons-desktop { display: flex; align-items: center; gap: 16px; }
    .bottom-nav { display: none; }
    body { max-width: 720px; padding-bottom: 80px; }
    .header { padding: 16px 32px; }
    .shop-cart-block { border-radius: 16px; margin-bottom: 16px; border-bottom: none; box-shadow: var(--shadow-card); overflow: hidden; }
    .guest-notice { margin-left: 32px; margin-right: 32px; }
    .continue-wrap { padding-left: 32px; padding-right: 32px; }
  }
</style>
</head>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
  const SUPABASE_URL = 'https://uawhrpizzlchkvmzrjzo.supabase.co';
  const SUPABASE_KEY = 'sb_publishable_FaOqUE1PDbo-fpT9KhkWaw__BShLngI';
  const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  let currentUserId = null;
  const cartThumbClasses = ['g1', 'g2', 'g3', 'g4'];

  (async function initCart() {
    const { data: { session } } = await supabaseClient.auth.getSession();
    if (!session) {
      window.location.href = 'komcho-market-login.html';
      return;
    }
    currentUserId = session.user.id;
    await loadCart();
  })();

  async function loadCart() {
    const container = document.getElementById('cartShopBlocks');
    const { data, error } = await supabaseClient
      .from('cart_items')
      .select('id, quantity, products(id, name, price, image_url, shipping_free, shipping_method, shops(id, shop_name, logo_url, shipping_normal, shipping_cold, free_shipping_threshold))')
      .eq('user_id', currentUserId)
      .order('created_at', { ascending: false });

    if (error) {
      console.error('カゴ取得エラー:', error);
      container.innerHTML = '<p style="text-align:center;padding:40px 16px;font-size:13px;color:var(--text-sub);">読み込みに失敗しました</p>';
      return;
    }

    const items = (data || []).filter(row => row.products && row.products.shops);
    updateCartBadgesUI(items.reduce((s, i) => s + i.quantity, 0));

    if (items.length === 0) {
      container.innerHTML = '';
      document.getElementById('emptyState').classList.add('visible');
      return;
    }
    document.getElementById('emptyState').classList.remove('visible');

    // ショップごとにグループ化
    const byShop = {};
    items.forEach(row => {
      const shop = row.products.shops;
      if (!byShop[shop.id]) byShop[shop.id] = { shop, rows: [] };
      byShop[shop.id].rows.push(row);
    });

    container.innerHTML = Object.values(byShop).map(({ shop, rows }) => {
      const subtotal = rows.reduce((s, r) => s + (r.products.price || 0) * r.quantity, 0);
      const hasCold = rows.some(r => r.products.shipping_method === 'cold' || r.products.shipping_method === 'frozen');
      const allFree = rows.every(r => r.products.shipping_free);
      const threshold = shop.free_shipping_threshold;
      const overThreshold = threshold != null && subtotal >= threshold;
      const isFree = allFree || overThreshold;
      const baseShipping = hasCold ? (shop.shipping_cold ?? 1000) : (shop.shipping_normal ?? 800);
      const shipping = isFree ? 0 : baseShipping;
      const total = subtotal + shipping;
      const earnPt = Math.floor(total / 200);
      const count = rows.reduce((s, r) => s + r.quantity, 0);
      const shippingLabel = hasCold ? 'クール便（冷蔵・冷凍）' : '通常便';
      const logoInner = shop.logo_url
        ? `<img src="${shop.logo_url}" style="width:100%;height:100%;object-fit:cover;border-radius:inherit;">`
        : 'SHOP<br>LOGO';

      const itemsHtml = rows.map((r, i) => {
        const p = r.products;
        const thumbClass = cartThumbClasses[i % cartThumbClasses.length];
        const thumbInner = p.image_url
          ? `<img src="${p.image_url}" style="width:100%;height:100%;object-fit:cover;border-radius:inherit;">`
          : '🛍️';
        return `
          <div class="cart-item" data-cart-id="${r.id}" data-price="${p.price}">
            <a href="komcho-market-product.html?id=${p.id}" class="cart-item-img ${thumbClass}" style="display:flex;align-items:center;justify-content:center;text-decoration:none;overflow:hidden;">${thumbInner}</a>
            <div class="cart-item-info">
              <a href="komcho-market-product.html?id=${p.id}" style="text-decoration:none;color:inherit;display:block;">
                <div class="cart-item-name">${p.name}</div>
                <div class="cart-item-price" data-line-price>¥${(p.price * r.quantity).toLocaleString()}</div>
              </a>
              <div class="cart-item-controls">
                <button class="qty-btn" onclick="changeQty('${r.id}', -1)">－</button>
                <div class="qty-num" data-qty>${r.quantity}</div>
                <button class="qty-btn" onclick="changeQty('${r.id}', 1)">＋</button>
                <button class="cart-item-delete" onclick="deleteItem('${r.id}')">
                  <svg viewBox="0 0 24 24"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/><path d="M9 6V4h6v2"/></svg>
                </button>
              </div>
            </div>
          </div>
        `;
      }).join('');

      return `
        <div class="shop-cart-block" id="shop-${shop.id}" data-shop-id="${shop.id}" data-threshold="${threshold ?? ''}" data-shipping="${baseShipping}" data-all-free="${allFree}">
          <div class="shop-cart-header">
            <a href="komcho-market-shop.html?id=${shop.id}" style="display:flex;align-items:center;gap:10px;text-decoration:none;color:inherit;">
              <div class="shop-cart-logo">${logoInner}</div>
              <div class="shop-cart-name">${shop.shop_name || ''}</div>
            </a>
            <div class="shop-cart-count" data-count>${count}点</div>
          </div>

          <div class="cart-items" data-items>
            ${itemsHtml}
          </div>

          <div class="shop-summary">
            <div class="shop-summary-row">
              <span>小計</span>
              <span data-subtotal>¥${subtotal.toLocaleString()}</span>
            </div>
            <div class="shop-summary-row">
              <span>送料 <span class="delivery-type-badge">${shippingLabel}</span></span>
              <span data-shipping-amount>${isFree ? '無料' : '¥' + shipping.toLocaleString()}</span>
            </div>
            <div class="free-shipping-note" data-free-note style="display:${isFree ? 'flex' : 'none'};">
              🎁 送料無料が適用されました！
            </div>
            <div class="shop-summary-row total">
              <span>この店舗の合計</span>
              <span data-total>¥${total.toLocaleString()}</span>
            </div>
          </div>

          <div class="checkout-block">
            <div class="checkout-point-earn" data-point-earn>
              🌿 この注文で <strong>${earnPt}pt</strong> 獲得予定（200円で1pt）
            </div>
            <button class="checkout-btn" onclick="goCheckout('${shop.id}')">
              <svg viewBox="0 0 24 24"><path d="M5 12h14"/><path d="M12 5l7 7-7 7"/></svg>
              ${shop.shop_name || 'この店舗'}の注文手続きへ
            </button>
            <div class="checkout-note">住所・お支払い方法は次の画面で選択できます</div>
          </div>
        </div>
        <div class="gap"></div>
      `;
    }).join('');
  }

  // 数量変更
  async function changeQty(cartId, delta) {
    const el = document.querySelector(`[data-cart-id="${cartId}"]`);
    if (!el) return;
    const qtyEl = el.querySelector('[data-qty]');
    const currentQty = parseInt(qtyEl.textContent);
    const newQty = currentQty + delta;

    if (newQty < 1) { deleteItem(cartId); return; }
    if (newQty > 99) return;

    const { error } = await supabaseClient.from('cart_items').update({ quantity: newQty }).eq('id', cartId);
    if (error) { console.error('数量更新エラー:', error); alert('更新に失敗しました：' + error.message); return; }

    await loadCart();
  }

  // 削除
  async function deleteItem(cartId) {
    if (!confirm('この商品をカゴから削除しますか？')) return;
    const { error } = await supabaseClient.from('cart_items').delete().eq('id', cartId);
    if (error) { console.error('削除エラー:', error); alert('削除に失敗しました：' + error.message); return; }
    showToast('商品を削除しました');
    await loadCart();
  }

  function updateCartBadgesUI(total) {
    document.querySelectorAll('.cart-badge').forEach(el => {
      el.textContent = total;
      el.style.display = total > 0 ? 'flex' : 'none';
    });
  }

  function goCheckout(shopId) {
    window.location.href = `komcho-market-checkout.html?shop=${shopId}`;
  }

  function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg; t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 2500);
  }
</script>
</body>
</html>
