<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>レシピ - こむちょマーケット</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 48 48%27%3E%3Crect width=%2748%27 height=%2748%27 rx=%2710%27 fill=%27%233D5A3E%27/%3E%3Cg transform=%27translate(24,24) scale(0.55)%27%3E%3Cpath d=%27M -26 7 C -17 -17 5 -24 24 -10 C 12 5 -2 19 -21 24%27 fill=%27none%27 stroke=%27%23F8F5EF%27 stroke-width=%275%27 stroke-linecap=%27round%27 stroke-linejoin=%27round%27/%3E%3C/g%3E%3C/svg%3E">
<style>
  :root {
    --bg:#F8F5EF; --bg-card:#FFFFFF; --green-dark:#3D5A3E; --green-mid:#5A7A5B;
    --green-light:#EAF0E8; --gold:#B8973A; --text-main:#2C2C2C; --text-sub:#6B6B6B;
    --border:#E2DDD5; --radius-card:12px; --shadow-card:0 2px 12px rgba(0,0,0,0.07);
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Hiragino Kaku Gothic ProN','Hiragino Sans','Yu Gothic','Meiryo',sans-serif;
    background: var(--bg); color: var(--text-main);
    max-width: 430px; margin: 0 auto; min-height: 100vh; padding-bottom: 100px;
  }
  a { text-decoration: none; color: inherit; }
  button { cursor: pointer; border: none; background: none; font-family: inherit; }

  .header {
    position: sticky; top: 0; z-index: 100;
    background: var(--bg); border-bottom: 1px solid var(--border);
    display: flex; align-items: center; justify-content: space-between;
    padding: 12px 16px;
  }
  .header-back {
    width: 32px; height: 32px; display: flex; align-items: center; justify-content: center;
  }
  .header-back svg { width: 22px; height: 22px; stroke: var(--text-main); fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  .header-title { font-size: 15px; font-weight: 700; }
  .header-spacer { width: 32px; }

  .hero {
    background: var(--green-dark); padding: 32px 24px 28px;
    position: relative; overflow: hidden;
  }
  .hero::before {
    content: ''; position: absolute; top: -40px; right: -40px;
    width: 180px; height: 180px; border-radius: 50%;
    background: rgba(255,255,255,0.05);
  }
  .hero-label { font-size: 10px; color: rgba(255,255,255,0.6); letter-spacing: 0.15em; margin-bottom: 8px; }
  .hero-title { font-size: 20px; font-weight: 700; color: #fff; line-height: 1.5; }
  .hero-sub { font-size: 12px; color: rgba(255,255,255,0.8); margin-top: 8px; line-height: 1.7; }

  .post-list { padding: 20px 16px; display: flex; flex-direction: column; gap: 18px; }
  .post-card {
    display: block; background: var(--bg-card);
    border-radius: var(--radius-card); box-shadow: var(--shadow-card);
    overflow: hidden;
  }
  .post-card-cover {
    width: 100%; height: auto; min-height: 120px; background: var(--green-light);
    display: block;
  }
  .post-card-body { padding: 14px 16px 16px; }
  .post-card-title { font-size: 15px; font-weight: 700; margin-bottom: 6px; }
  .post-card-intro {
    font-size: 12.5px; color: var(--text-sub); line-height: 1.7;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
  }
  .post-card-meta { font-size: 11px; color: var(--text-sub); margin-top: 8px; }

  .empty-state { text-align: center; padding: 60px 16px; color: var(--text-sub); font-size: 13px; }

  .bottom-nav {
    position: fixed; bottom: 0; left: 50%; transform: translateX(-50%);
    width: 100%; max-width: 430px;
    background: var(--bg-card); border-top: 1px solid var(--border);
    display: flex; z-index: 200;
  }
  .nav-item {
    flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px;
    padding: 10px 0 14px; color: var(--text-sub);
    font-size: 10px; letter-spacing: 0.04em; cursor: pointer;
  }
  .nav-item.active { color: var(--green-dark); }
  .nav-item svg {
    width: 22px; height: 22px;
    stroke: currentColor; fill: none;
    stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round;
  }
  /* ============ DESKTOP (≥900px) ============ */
  .header-icons-desktop { display: none; }
  .header-icons-desktop a { display: flex; }
  .header-icons-desktop svg {
    width: 20px; height: 20px;
    stroke: var(--text-main); fill: none;
    stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round;
  }
  @media (min-width: 900px) {
    .header { justify-content: flex-start; gap: 20px; }
    .header-icons-desktop { margin-left: auto; }
    .header-spacer { display: none; }
    .header-icons-desktop { display: flex; align-items: center; gap: 16px; }
    .bottom-nav { display: none; }
    body { max-width: 720px; padding-bottom: 80px; }
    .header { padding: 16px 32px; }
    .post-list { grid-template-columns: 1fr 1fr; display: grid; gap: 20px; }
  }
</style>
</head>
<body>

<!-- HEADER -->
<header class="header">
  <button class="header-back" onclick="history.back()">
    <svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg>
  </button>
  <div class="header-title">レシピ</div>
  <div class="header-spacer"></div>
<div class="header-icons-desktop">
  <a href="komcho-market-search.html"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg></a>
  <a href="komcho-market-favorites.html"><svg viewBox="0 0 24 24"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg></a>
  <a href="komcho-market-cart.html"><svg viewBox="0 0 24 24"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg></a>
  <a href="komcho-market-orders.html"><svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg></a>
  <a href="komcho-market-mypage.html"><svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg></a>
</div>
</header>

<!-- HERO -->
<div class="hero">
  <div class="hero-label">RECIPE</div>
  <div class="hero-title">こむちょの食卓、<br>のぞいてみませんか。</div>
  <div class="hero-sub">買った商品を、実際にどう使っているか。季節ごとの食卓をご紹介します。</div>
</div>

<div class="post-list" id="postList">
  <p style="font-size:12px;color:var(--text-sub);padding:8px 0;grid-column:1/-1;">読み込み中...</p>
</div>

<!-- BOTTOM NAV -->
<nav class="bottom-nav">
  <a class="nav-item" href="komcho-market-top.html">
    <svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
    <span>ホーム</span>
  </a>
  <a class="nav-item" href="komcho-market-search.html">
    <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
    <span>探す</span>
  </a>
  <a class="nav-item" href="komcho-market-favorites.html">
    <svg viewBox="0 0 24 24"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
    <span>お気に入り</span>
  </a>
  <a class="nav-item" href="komcho-market-cart.html">
    <svg viewBox="0 0 24 24"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg>
    <span>カゴ</span>
  </a>
  <a class="nav-item" href="komcho-market-orders.html">
    <svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>
    <span>履歴</span>
  </a>
</nav>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
  const SUPABASE_URL = 'https://uawhrpizzlchkvmzrjzo.supabase.co';
  const SUPABASE_KEY = 'sb_publishable_FaOqUE1PDbo-fpT9KhkWaw__BShLngI';
  const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  (async function loadPosts() {
    const { data, error } = await supabaseClient
      .from('recipe_posts')
      .select('*')
      .order('created_at', { ascending: false });

    const list = document.getElementById('postList');

    if (error || !data || data.length === 0) {
      list.innerHTML = '<div class="empty-state">まだレシピの投稿がありません。<br>お楽しみに。</div>';
      return;
    }

    list.innerHTML = data.map(post => {
      const dateStr = new Date(post.created_at).toLocaleDateString('ja-JP', { year: 'numeric', month: 'long' });
      const coverInner = post.cover_image
        ? `<img class="post-card-cover" src="${post.cover_image}" alt="${post.title}">`
        : `<div class="post-card-cover"></div>`;
      return `
        <a class="post-card" href="komcho-market-recipe-detail.html?id=${post.id}">
          ${coverInner}
          <div class="post-card-body">
            <div class="post-card-title">${post.title}</div>
            ${post.intro ? `<div class="post-card-intro">${post.intro}</div>` : ''}
            <div class="post-card-meta">${dateStr}</div>
          </div>
        </a>
      `;
    }).join('');
  })();
</script>
</body>
</html>
